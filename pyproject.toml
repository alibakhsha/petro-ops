[project]
name = "petro-ops"
version = "0.3.0"
description = "Offline hierarchical RAG core for organizational knowledge, issue management and knowledge transfer."
readme = "README.md"
authors = [
    { name = "Amir Hasanshahi", email = "amir13831107h@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.16.2",
    "pypdfium2>=5.14.0",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "offline_rag"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "PT", "C4", "TID", "BLE", "TRY", "EM", "LOG", "G"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# Settings are read only through offline_rag.settings, so .env.example stays complete.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "Read settings through offline_rag.settings.Settings."
"os.getenv".msg = "Read settings through offline_rag.settings.Settings."

[tool.ruff.lint.per-file-ignores]
".claude/hooks/*" = ["TID251"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["offline_rag"]

# pypdfium2 ships no type information.
[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import the shared fakes as `tests.fakes`.
pythonpath = ["."]
addopts = "-ra --strict-markers --import-mode=importlib --cov=offline_rag --cov-report=term-missing"
markers = [
    "slow: long-running tests (real models, full benchmark)",
    "integration: real adapters wired together",
    "smoke: full pipeline on tiny fixtures",
    "regression: golden-set and judge-score regression",
    "e2e: end-to-end scenarios",
]

# The 80% gate is set in CI, where unit and integration tests run together.
# A unit-only run leaves the adapters uncovered, so it has no gate.
[tool.coverage.report]
skip_empty = true

[tool.importlinter]
root_package = "offline_rag"

[[tool.importlinter.contracts]]
name = "Hexagonal layers in each bounded context"
type = "layers"
containers = ["offline_rag.knowledge"]
layers = ["interface", "infrastructure", "application", "domain"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true

[dependency-groups]
dev = [
    "commitizen>=4.19.3",
    "hypothesis>=6.170.14",
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261103",
]
